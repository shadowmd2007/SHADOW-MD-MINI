
<div id="api-status">Loading commands...</div>
<div id="api-commands"></div>

<script>
async function loadCommands() {
  const status = document.getElementById("api-status");
  const output = document.getElementById("api-commands");

  try {
    const response = await fetch("/api/commands");

    if (!response.ok) {
      throw new Error("API error: " + response.status);
    }

    const data = await response.json();
    const commands = Array.isArray(data)
      ? data
      : data.commands || [];

    status.textContent = "Total commands: " + commands.length;
    output.replaceChildren();

    commands.forEach((command) => {
      const item = document.createElement("div");
      item.textContent =
        typeof command === "string"
          ? command
          : command.name || command.command || JSON.stringify(command);
      output.appendChild(item);
    });
  } catch (error) {
    status.textContent = "API connect nahi hui: " + error.message;
  }
}

loadCommands();
</script>
