<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHADOW MD</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#16181d; --muted:#6b7280; --accent:#128c7e; --border:#e2e5ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1116; --card:#171b22; --text:#eef0f4; --muted:#9aa3b2; --border:#2a303a; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:16px; }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; }
  h1 { margin:0 0 4px; font-size:22px; }
  p { color:var(--muted); margin:0 0 18px; font-size:14px; }
  input,button { width:100%; padding:12px 14px; font-size:16px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
  button { margin-top:10px; background:var(--accent); color:#fff; border:0; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; }
  #out { margin-top:16px; text-align:center; font-size:30px; letter-spacing:3px; font-weight:700; word-break:break-all; }
  #msg { margin-top:8px; font-size:13px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<div class="card">
  <h1>SHADOW MD</h1>
  <p>Apna WhatsApp number (country code ke sath) likho aur pairing code lo. Link hone par SESSION_ID usi number par aa jayegi.</p>
  <input id="num" inputmode="numeric" placeholder="923001234567">
  <button id="btn">Get Pairing Code</button>
  <div id="out"></div>
  <div id="msg"></div>
</div>
<script>
  const btn = document.getElementById('btn'), out = document.getElementById('out'), msg = document.getElementById('msg');
  btn.onclick = async () => {
    const n = document.getElementById('num').value.replace(/\D/g, '');
    out.textContent = ''; msg.textContent = 'Code ban raha hai...'; btn.disabled = true;
    try {
      const r = await fetch('/pair?number=' + n);
      const d = await r.json();
      if (d.code) { out.textContent = d.code; msg.textContent = 'WhatsApp > Linked Devices > Link with phone number mein ye code daalo.'; }
      else msg.textContent = d.error || 'Error aa gaya';
    } catch (e) { msg.textContent = 'Server se connect nahi hua'; }
    btn.disabled = false;
  };
</script>
</body>
</html>
